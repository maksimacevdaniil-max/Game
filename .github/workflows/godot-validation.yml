name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch main island scene headlessly
        run: godot --headless --path . --quit-after 5
