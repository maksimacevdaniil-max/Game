name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch main island scene headlessly
        run: godot --headless --path . --quit-after 5

      - name: Install screenshot dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Capture real in-engine map screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MAP_CAPTURE_FOCUS: "86,38,-253"
        run: |
          xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://scripts/capture_map.gd
          test -s previews/island-overview.jpg
          test -s previews/island-detail.jpg

      - name: Publish map screenshots to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/island-overview.jpg previews/island-detail.jpg
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Refresh in-engine island screenshots"
            git push
          fi
